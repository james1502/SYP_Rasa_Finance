version: "3.1"

slots:
  security_name:
    type: text
    mappings:
      - type: from_llm

  data_type:
    type: text
    mappings:
      - type: from_llm

  corrected_query:
    type: text
    mappings:
      - type: controlled    

  index_name:
    type: text
    mappings:
      - type: from_llm

  news_topic:
    type: text
    mappings:
      - type: from_llm
 
  comparison_items:
    type: text
    
    mappings:
      - type: from_llm

  comparison_criteria:
    type: text
    
    mappings:
      - type: from_llm

  comparison_output:
    type: text
    
    mappings:
      - type: controlled

  market_data_output:
    type: text
    mappings:
      - type: controlled

  index_info_output:
    type: text
    mappings:
      - type: controlled

  news_output:
    type: text
    mappings:
      - type: controlled

  analysis_company:
    type: text
    mappings:
      - type: from_llm

  analysis_output:
    type: text
    mappings:
      - type: controlled

  chart_asset:
      type: text
      mappings:
        - type: from_llm

  chart_output:
    type: text
    mappings:
      - type: controlled

  chart_image_url:
    type: text
    mappings:
      - type: controlled

  #mid term
  # Transaction recording slots
  
  transaction_type:
    type: text
    mappings:
      - type: from_llm
  
  transaction_shares:
    type: float
    mappings:
      - type: from_llm
  
  transaction_asset:
    type: text
    mappings:
      - type: from_llm
  
  transaction_date:
    type: text
    mappings:
      - type: from_llm
  
  transaction_id:
    type: text
    mappings:
      - type: controlled
  
  # Transaction viewing slot
  filter_asset:
    type: text   
    mappings:
      - type: from_llm

  transaction_result_output:
    type: text
    mappings:
      - type: controlled

  portfolio_output:
    type: text
    mappings:
      - type: controlled

  asset_transactions_output:
    type: text
    mappings:
      - type: controlled


actions:
  - action_fetch_market_data
  - action_fetch_index_info
  - action_fetch_market_news
  - action_fetch_comparison_data
  - action_correct_typo
  - validate_comparison_items
  - action_fetch_analysis
  - action_show_chart
  #extract
  - action_extract_security_name
  - action_extract_index_name
  - action_extract_news_topic
  - action_extract_comparison_items
  - action_extract_analysis_company
  - action_extract_chart_asset
  #mid
  - action_save_transaction
  - action_get_transactions
  - action_get_transactions_by_asset
  #- action_route_clarified_query
  #- action_trigger_search

responses:
  utter_greet:
    - text: "Hello! Welcome to the Financial Market Assistant. I'm here to help you with market data, index information, and market news."
      metadata:
        rephrase: true

  utter_ask_rephrase:
    - text: "I'm sorry, I couldn't understand that. Could you please rephrase your question?"
      metadata:
        rephrase: true

  utter_offer_help:
    - text: "I can help you with:\n• Current stock prices and market data\n• Information about market indexes (S&P 500, NASDAQ, etc.)\n• Latest market news\n• Comparing securities or indexes\n\nWhat would you like to know?"
      metadata:
        rephrase: true

  utter_ask_security_name:
    - text: "Which stock or security would you like information about? Please provide the company name or ticker symbol."
      metadata:
        rephrase: true

  utter_ask_data_type:
    - text: "What specific data would you like? For example: current price, volume, 52-week high, 52-week low, or market cap."
      metadata:
        rephrase: true

  utter_market_data_results:
    - text: "Here's the market data for {security_name}:\n{market_data_output}"
      metadata:
        rephrase: true

  utter_ask_index_name:
    - text: "Which market index are you interested in? For example: S&P 500, NASDAQ, DJIA, or FTSE 100."
      metadata:
        rephrase: true

  utter_index_info_results:
    - text: "Here's the information for {index_name}:\n{index_info_output}"
      metadata:
        rephrase: true

  utter_ask_news_topic:
    - text: "What topic would you like news about? You can ask for general market news, news about a specific company, or news about a market sector."
      metadata:
        rephrase: true

  utter_news_results:
    - text: "Here are the latest news items about {news_topic}:\n{news_output}"
      metadata:
        rephrase: true

  utter_ask_comparison_items:
    - text: "What would you like to compare? Please specify the securities or indexes (you can list multiple items separated by commas)."
      metadata:
        rephrase: true

  utter_ask_comparison_criteria:
    - text: "What criteria should I use for the comparison? For example: performance over the last month, year-to-date returns, or volatility."
      metadata:
        rephrase: true

  utter_comparison_results:
    - text: "Here's the comparison:\n{comparison_output}"
      metadata:
        rephrase: true

  utter_ask_followup:
    - text: "Would you like to ask another question, get more details, or exit?"
      metadata:
        rephrase: true

  utter_goodbye:
    - text: "Thank you for using the Financial Market Assistant. Have a great day!"
      metadata:
        rephrase: true

  utter_cannot_handle:
    - text: "I'm sorry, I couldn't process that request. Could you rephrase or ask something else?"
      metadata:
        rephrase: true

  utter_search_results:
    - text: "{search_results}"
      metadata:
        rephrase: true

  utter_no_relevant_answer_found:
    - text: "I'm sorry, I can't help with that."
      metadata:
        rephrase: true

  utter_can_do_something_else:
    - text: "What else can I help you with?"
      metadata:
        rephrase: true

  utter_analysis_results:
    - text: "Here's the analysis for {analysis_company}:\n{analysis_output}"
      metadata:
        rephrase: true

  utter_ask_analysis_company:
    - text: "Which company would you like me to analyze? Please provide the company name or ticker symbol."
      metadata:
        rephrase: true

  utter_ask_chart_asset:
    - text: "Which asset would you like to see a chart for? You can request charts for stocks, cryptocurrencies, or market indexes."
      metadata:
        rephrase: true

  utter_chart_results:
    - text: "{chart_output}"
      image: "{chart_image_url}"
      metadata:
        rephrase: true

  utter_ask_transaction_type:
    - text: "What type of transaction would you like to record? (buy, sell, deposit, or withdrawal)"
      metadata:
        rephrase: true
  
  utter_ask_transaction_shares:
    - text: "How many shares did you purchase?"
      metadata:
        rephrase: true

  utter_ask_transaction_asset:
    - text: "Which asset or security was involved in this transaction?"
      metadata:
        rephrase: true

  utter_ask_transaction_date:
    - text: "When did this transaction occur? (You can say 'today', 'yesterday', or provide a specific date)"
      metadata:
        rephrase: true

  utter_ask_filter_asset:
    - text: "Which asset would you like to see transactions for?"
      metadata:
        rephrase: true


  utter_transaction_saved:
    - text: "{transaction_result_output}"
      metadata:
        rephrase: true


  utter_invalid_amount:
    - text: "❌ The transaction amount must be a positive number. Please try again."
      metadata:
        rephrase: true  

  utter_portfolio_empty:
    - text: "📊 You don't have any transactions recorded yet. Start by recording a buy or sell transaction!"
      metadata:
        rephrase: true

  utter_portfolio_results:
    - text: "{portfolio_output}"
      metadata:
        rephrase: true

  utter_asset_transactions_results:
    - text: "{asset_transactions_output}"
      metadata:
        rephrase: true

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true