
action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
  type: rephrase
  rephrase_all: true
  summarize_history: false
  max_historical_turns: 5 
  llm:
    model_group: ollama_llm    
  prompt_template: prompts/response-rephraser-template.jinja2

model_groups:
  - id: ollama_llm
    models:
      - provider: ollama
        model: llama3.1:8b
        api_base: "http://localhost:11434"
        request_timeout: 120
  
  - id: ollama_embeddings
    models:
      - provider: huggingface_local
        model: "BAAI/bge-small-en-v1.5"
        model_kwargs:
          device: "cpu"
        encode_kwargs:
          normalize_embeddings: true
        
  - id: hf_emb
    models:
      - provider: huggingface_local
        model: "sentence-transformers/all-MiniLM-L6-v2"
        model_kwargs:
          device: "cpu"
        encode_kwargs:
          normalize_embeddings: true
  