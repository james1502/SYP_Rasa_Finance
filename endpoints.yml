#nlg:
##  type: rephrase
 # llm:
   # model_group: ollama_llm
action_endpoint:
  url: "http://localhost:5055/webhook"

#nlg:
#  type: rephrase
#  llm:
#    model_group: ollama_llm
#  prompt_template: prompts/nlg-rephraser.jinja2

model_groups:
  - id: ollama_llm
    models:
      - provider: ollama
        model: llama3.1:8b
        api_base: "http://localhost:11434"
        temperature: 0.5
        max_tokens: 800
        api_key: ${OLLAMA_API_KEY}
        request_timeout: 120  # Add timeout here
  
  - id: ollama_embeddings
    models:
      - provider: huggingface_local
        model: "BAAI/bge-small-en-v1.5"
        model_kwargs:
          device: "cpu"
        encode_kwargs:
          normalize_embeddings: true
        
